{% extends "base.html" %}

{% block title %}500 Internal Error — HeartSense AI{% endblock %}

{% block content %}
<section class="py-5 text-center">
    <div class="container max-w-600 py-5">
        <div class="glass-card glow-primary p-5">
            <div class="display-1 text-danger fw-extrabold mb-3">500</div>
            <h2 class="fw-bold mb-3 text-dark">Internal System Exception</h2>
            <p class="text-muted mb-4">
                An unexpected server exception occurred while processing the request. Please try again or return to the main dashboard.
            </p>
            <a href="/" class="btn btn-primary-custom">
                <i class="fa-solid fa-house me-1"></i> Return to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
